name: Sonar Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scan:
    uses: nirojasmar/base-workflows/.github/workflows/sonar-scan.yml@v1
    with:
      project_key: "hobio"
      scanner_type: "dotnet"
      test_settings_path: "tests/coverlet.runsettings"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: ${{ secrets.SONAR_ORG }}
 

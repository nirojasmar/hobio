name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build-api:
    uses: nirojasmar/base-workflows/.github/workflows/docker-test-build.yml@infra-workflows
    with:
      image_name: hobio-nonprod/hobio-nonprod-repo-ue1/hobio-api
      environment: ${{ github.event.inputs.environment }} 

  build-web:
    uses: nirojasmar/base-workflows/.github/workflows/docker-test-build.yml@infra-workflows
    with:
      image_name: hobio-nonprod/hobio-nonprod-repo-ue1/hobio-web
      environment: ${{ github.event.inputs.environment }}
      
    